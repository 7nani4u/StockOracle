name: Refresh Smart Score universe

on:
  schedule:
    # Monday and Thursday 03:17 UTC: a successful snapshot is always under 8 days old.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-charm-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Refresh financial comparison universe
        run: python scripts/refresh_charm_universe.py --workers 4

      - name: Validate rank calculation
        run: python -m pytest tests/test_charm_ranking.py tests/test_investment_charm.py -q

      - name: Commit refreshed snapshot
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- models/smart_score_universe.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/smart_score_universe.json
          git commit -m "chore: refresh Smart Score universe"
          git push origin "HEAD:${BRANCH}"
